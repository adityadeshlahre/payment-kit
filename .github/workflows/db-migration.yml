name: Database Migration

on:
  push:
    branches:
      - master
    paths:
      - "apps/server/src/db/schema/**"
      - "apps/server/src/db/migrations/**"
      - "apps/server/drizzle.config.ts"
  workflow_dispatch:

jobs:
  detect-schema-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect schema changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Manual migration requested"
          else
            git diff --name-only HEAD^ HEAD > changed_files.txt
            if grep -E '^apps/server/src/db/(schema|migrations)/' changed_files.txt || grep 'drizzle.config.ts' changed_files.txt; then
              echo "has-changes=true" >> $GITHUB_OUTPUT
              echo "Database schema changes detected"
            else
              echo "has-changes=false" >> $GITHUB_OUTPUT
              echo "No database schema changes detected"
            fi
          fi

  validate-schema:
    runs-on: ubuntu-latest
    needs: detect-schema-changes
    if: needs.detect-schema-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/server/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-migration-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate migration files
        working-directory: apps/server
        run: |
          # Generate new migration files if schema changed
          bun run db:generate

          # Check if any new migration files were created
          if [ -n "$(find src/db/migrations -name '*.sql' -newer .git/HEAD)" ]; then
            echo "New migration files generated"
            git add src/db/migrations/
            git diff --cached --name-only
          else
            echo "No new migration files needed"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    runs-on: ubuntu-latest
    needs: [detect-schema-changes, validate-schema]
    if: needs.detect-schema-changes.outputs.has-changes == 'true'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Supabase CLI
        run: |
          curl -sSfL https://supabase.com/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Backup database before migration
        working-directory: apps/server
        run: |
          echo "Logging into Supabase..."
          supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

          echo "Linking to production project..."
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

          echo "Creating database backup..."
          timestamp=$(date +%Y%m%d_%H%M%S)
          echo "Backup timestamp: $timestamp"
          # Note: Actual backup commands would depend on your Supabase setup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Run production migrations
        working-directory: apps/server
        run: |
          echo "Checking current migration status..."
          supabase db diff --linked

          echo "Applying migrations to production..."
          supabase db push --linked

          echo "Production migration completed successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Verify migration success
        working-directory: apps/server
        run: |
          echo "Verifying migration status..."
          supabase db diff --linked

          echo "Migration verification completed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  migration-summary:
    runs-on: ubuntu-latest
    needs: [detect-schema-changes, migrate-production]
    if: always()
    steps:
      - name: Migration Summary
        run: |
          echo "## 🗄️ Database Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-schema-changes.outputs.has-changes }}" = "true" ]; then
            echo "📋 **Schema Changes**: Detected" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.migrate-production.result }}" = "success" ]; then
              echo "✅ **Production**: Migration completed successfully" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.migrate-production.result }}" = "failure" ]; then
              echo "❌ **Production**: Migration failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ **Production**: Migration skipped" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "📋 **Schema Changes**: None detected" >> $GITHUB_STEP_SUMMARY
            echo "⏭️ **Migration**: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*For manual migration triggers, use the workflow_dispatch event*" >> $GITHUB_STEP_SUMMARY
