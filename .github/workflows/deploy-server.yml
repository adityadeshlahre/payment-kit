name: Deploy Server to Production

on:
  push:
    branches:
      - master
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/server/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-server-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase migration status
        working-directory: apps/server
        run: |
          # Install Supabase CLI
          curl -sSfL https://supabase.com/install.sh | sh
          export PATH="$PATH:$HOME/.local/bin"

          # Check if migrations are up to date
          if [ ! -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ ! -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "Checking migration status..."
            supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
            supabase db diff --linked
          else
            echo "Supabase credentials not configured, skipping migration check"
          fi

      - name: Run database migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        working-directory: apps/server
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          # Push any pending migrations to Supabase
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Build server application
        run: bun run build --filter=server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DODO_SECRET_KEY: ${{ secrets.DODO_SECRET_KEY }}
          DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/server
        run: bun x wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DODO_SECRET_KEY: ${{ secrets.DODO_SECRET_KEY }}
          DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}
