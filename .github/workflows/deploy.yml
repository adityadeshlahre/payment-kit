name: Deploy Next.js to Cloudflare

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/bun@v0.7.12
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Next.js app (web)
        working-directory: apps/web
        run: bun run build

      - name: Install Wrangler
        run: bunx wrangler

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: bunx wrangler deploy --env production
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
